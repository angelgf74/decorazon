name: Verificar

on:
  # En las ramas basta el pull_request: con push sin filtro, cada commit de una rama con PR pasaba el CI dos veces.
  push:
    branches: [main]
  pull_request:

# Un commit nuevo cancela la ejecución anterior del mismo PR; en main se terminan todas.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run api:tipos && git diff --exit-code src/api/esquema.d.ts
      - run: npm test
      - run: npm run build
      # El presupuesto de arranque (pruebas-build) mide dist: solo tras compilar, y en el CI no se salta.
      - run: EXIGIR_DIST=1 npx vitest run pruebas-build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet build Decorazon.slnx -warnaserror
      # El build regenera el contrato; si difiere del confirmado, la web iría con tipos viejos.
      - run: git diff --exit-code web/src/api/openapi.json
      # El mismo build con el entorno Development (el de un dotnet run local): la
      # generación del OpenAPI no debe migrar ni conectar con la base.
      - run: dotnet build src/Decorazon.Api --no-incremental
        env:
          ASPNETCORE_ENVIRONMENT: Development
      - run: git diff --exit-code web/src/api/openapi.json
      # Docker ya viene en el runner: corren también los tests de integración.
      - run: dotnet test Decorazon.slnx

  e2e-cuentas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          # Solo para el CI: la misma base de pruebas que docker-compose.yml.
          POSTGRES_DB: decorazon
          POSTGRES_USER: decorazon
          POSTGRES_PASSWORD: decorazon_local
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U decorazon -d decorazon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Arranca la API (crea y migra decorazon_e2e) y el preview; la clave JWT la genera la config.
      - run: npm run e2e:cuentas

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-cuentas
          path: |
            web/test-results
            web/playwright-report
          retention-days: 7
