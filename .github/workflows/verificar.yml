name: Verificar

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run api:tipos && git diff --exit-code src/api/esquema.d.ts
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet build Decorazon.slnx -warnaserror
      # El build regenera el contrato; si difiere del confirmado, la web iría con tipos viejos.
      - run: git diff --exit-code web/src/api/openapi.json
      # Docker ya viene en el runner: corren también los tests de integración.
      - run: dotnet test Decorazon.slnx
