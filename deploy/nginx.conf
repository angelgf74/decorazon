# Sitio de nginx de decorazon. Es la plantilla de srv (src/plantillas/nginx.js) mas lo marcado con "Tarjetas":
# a los lectores de tarjetas (WhatsApp, Facebook, Telegram...) se les sirve en /compartido/<enlace> la tarjeta de la
# API, con las etiquetas Open Graph; a las personas, la web de siempre.
#
# El puerto de la API (54011) va escrito a mano: srv no lo sustituye en un nginx propio. Es el de srv.json
# (api.puerto) y un test de arquitectura comprueba que coinciden.

# Tarjetas: quien lee tarjetas. Va en el contexto http (los sitios se incluyen en el); el nombre lleva la app.
map $http_user_agent $decorazon_lector_de_tarjetas {
    default 0;
    "~*(facebookexternalhit|facebookcatalog|meta-externalagent|WhatsApp|Twitterbot|TelegramBot|Slackbot|Discordbot|LinkedInBot|Pinterest|redditbot|Applebot|Embedly|Iframely|SkypeUriPreview|vkShare|Mastodon)" 1;
}

server {
    listen 80;
    server_name decorazon.angelgf.com.es;
    root /apps/decorazon/current/web;
    index index.html;
    server_tokens off;
    access_log /var/log/nginx/decorazon.access.log srv_combined;
    error_log /var/log/nginx/decorazon.error.log;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache, no-transform" always;
    # Tarjetas: a los lectores, la tarjeta de la API; al resto, la web.
    location ~ "^/compartido/(?<enlace>[A-Za-z0-9_-]{1,64})$" {
        if ($decorazon_lector_de_tarjetas) {
            rewrite ^ /__tarjeta/$enlace last;
        }
        try_files $uri /index.html;
    }

    # Tarjetas: solo por la reescritura de arriba. Si la API falla o limita, la web de siempre (el 404 de un enlace
    # retirado si llega: es la tarjeta generica). Host de la API: con el arma la direccion de la imagen.
    location ~ "^/__tarjeta/(?<tarjeta>[A-Za-z0-9_-]{1,64})$" {
        internal;
        proxy_pass http://127.0.0.1:54011/compartidos/$tarjeta/tarjeta;
        proxy_http_version 1.1;
        proxy_set_header Host decorazon-api.angelgf.com.es;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $srv_ip_real;
        proxy_set_header X-Real-IP $srv_ip_real;
        proxy_hide_header Cache-Control;
        proxy_read_timeout 10s;
        proxy_intercept_errors on;
        error_page 429 500 502 503 504 = /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name decorazon-api.angelgf.com.es;
    server_tokens off;
    access_log /var/log/nginx/decorazon-api.access.log srv_combined;
    error_log /var/log/nginx/decorazon-api.error.log;
    client_max_body_size 2m;
    location / {
        proxy_pass http://127.0.0.1:54011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $srv_ip_real;
        proxy_set_header X-Real-IP $srv_ip_real;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $srv_connection_upgrade;
        proxy_read_timeout 60s;
    }
}
